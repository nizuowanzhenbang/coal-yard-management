name: Quality checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx ruff
      - name: Check Python syntax and undefined names
        run: python -m ruff check backend --select E9,F63,F7,F82
      - name: Regression tests
        run: cd backend && python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check and production build
        run: npm run build
  evidence_postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: yard_evidence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yard_evidence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YARD_TEST_DATABASE_URL: postgresql+psycopg2://postgres:isolated_test_password@127.0.0.1:5432/yard_evidence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt pytest psycopg2-binary
      - name: Isolated accounting evidence regressions
        working-directory: backend
        run: python -m pytest tests/test_stockout_evidence.py tests/test_yard_quantity.py -q
